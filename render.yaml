# Blueprint do Render: New + > Blueprint > escolha este repositorio
services:
  - type: web
    name: auto-cutter
    runtime: docker
    plan: starter          # "free" funciona, mas e MUITO lento p/ video (0.1 CPU, 512 MB)
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false        # o Render pede o valor na criacao
      - key: X264_PRESET
        value: veryfast
      - key: FFMPEG_THREADS
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: JOB_TTL_MIN
        value: "60"
